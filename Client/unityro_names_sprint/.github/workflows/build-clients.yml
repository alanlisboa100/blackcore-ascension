name: Build Clients
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - develop
      - main
  #schedule:
  # - cron: "0 19 * * *"

jobs:
  test:
    name: EditMode tests 🧪
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/cache@v4
        with:
          path: UnityClient/Library
          key: Library-tests-${{ hashFiles('UnityClient/Packages/packages-lock.json') }}
          restore-keys: |
            Library-tests-
            Library-

      - name: Black Core preflight
        run: python3 tools/blackcore_preflight.py --client UnityClient

      - uses: game-ci/unity-test-runner@v4.3.1
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ./UnityClient/
          testMode: EditMode
          customParameters: -testFilter Tests.Network
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EditMode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  build:
    name: Build ${{ matrix.targetPlatform }} ✨
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          #- StandaloneOSX # Build a macOS standalone (Intel 64-bit).
          - StandaloneWindows64 # Build a Windows 64-bit standalone.
          #- StandaloneLinux64 # Build a Linux 64-bit standalone.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/cache@v4
        with:
          path: UnityClient/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('UnityClient/Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      # Keep the existing builder major until the Unity editor migration is tested.
      - uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ./UnityClient/
          targetPlatform: ${{ matrix.targetPlatform }}

      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
