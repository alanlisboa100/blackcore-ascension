<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BLACKCORE 2D Turbo Racer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0f0f1a; font-family: sans-serif; touch-action: none; display: flex; align-items: center; justify-content: center; height: 100vh; }
        canvas { background: #1a1a24; display: block; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        #hud { position: absolute; top: 20px; left: 20px; color: white; font-size: 18px; text-shadow: 2px 2px 4px #000; pointer-events: none; }
        #controls { position: absolute; bottom: 25px; width: 100%; display: flex; justify-content: space-between; padding: 0 25px; box-sizing: border-box; pointer-events: none; }
        .btn-group { display: flex; gap: 15px; pointer-events: auto; }
        .control-btn { width: 75px; height: 75px; background: rgba(255,255,255,0.2); border: 2px solid white; border-radius: 50%; color: white; font-size: 26px; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; backdrop-filter: blur(5px); }
        .control-btn:active { background: rgba(255,255,255,0.5); transform: scale(0.95); }
        #victory { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10,10,20,0.95); border: 3px solid #ffcc00; padding: 35px; text-align: center; color: white; border-radius: 15px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        #victory h1 { color: #ffcc00; margin-top: 0; }
        #victory button { background: #ffcc00; border: none; padding: 14px 28px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; color: #111; }
    </style>
</head>
<body>
    <div id="hud">
        <div id="lap-display">Volta: 1 / 3</div>
        <div id="time-display">Tempo: 00:00.00</div>
        <div id="speed-display">Velocidade: 0 km/h</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <div class="btn-group">
            <div class="control-btn" id="btn-left">◀</div>
            <div class="control-btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group">
            <div class="control-btn" id="btn-brake">🔻</div>
            <div class="control-btn" id="btn-accel">🚀</div>
        </div>
    </div>

    <div id="victory">
        <h1>🏆 VITÓRIA! 🏆</h1>
        <p id="final-time">Tempo Final: 00.00s</p>
        <button onclick="restartGame()">JOGAR NOVAMENTE</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth > 800 ? 800 : window.innerWidth;
            canvas.height = window.innerHeight > 600 ? 600 : window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let car = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 40,
            height: 70,
            angle: 0,
            speed: 0,
            maxSpeed: 8,
            accel: 0.2,
            friction: 0.1,
            steerSpeed: 0.05
        };

        let keys = { left: false, right: false, accel: false, brake: false };
        let trackOffset = 0;
        let currentLap = 1;
        let totalLaps = 3;
        let startTime = Date.now();
        let raceFinished = false;
        let trackHeight = 2000;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys.accel = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.brake = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys.accel = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.brake = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        });

        bindTouch('btn-accel', 'accel');
        bindTouch('btn-brake', 'brake');
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');

        function bindTouch(id, key) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; }, {passive: false});
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; }, {passive: false});
            el.addEventListener('mousedown', () => { keys[key] = true; });
            el.addEventListener('mouseup', () => { keys[key] = false; });
        }

        function update() {
            if (!raceFinished) {
                if (keys.accel) car.speed = Math.min(car.speed + car.accel, car.maxSpeed);
                else if (keys.brake) car.speed = Math.max(car.speed - car.accel, -car.maxSpeed * 0.5);
                else car.speed = Math.max(0, car.speed - car.friction);

                if (keys.left) car.angle -= car.steerSpeed * (car.speed / car.maxSpeed);
                if (keys.right) car.angle += car.steerSpeed * (car.speed / car.maxSpeed);

                car.x += Math.sin(car.angle) * car.speed;
                trackOffset += Math.cos(car.angle) * car.speed;

                // Track borders (road width 400 centered)
                const roadLeft = (canvas.width / 2) - 200;
                const roadRight = (canvas.width / 2) + 200;
                if (car.x < roadLeft + 20) car.x = roadLeft + 20;
                if (car.x > roadRight - 20) car.x = roadRight - 20;

                // Lap check
                if (trackOffset > trackHeight) {
                    trackOffset = 0;
                    currentLap++;
                    if (currentLap > totalLaps) {
                        raceFinished = true;
                        showVictory();
                    }
                }

                updateHUD();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Road background
            const roadLeft = (canvas.width / 2) - 200;
            ctx.fillStyle = '#22222a';
            ctx.fillRect(roadLeft, 0, 400, canvas.height);

            // Draw road lines (moving)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.setLineDash([30, 30]);
            ctx.lineDashOffset = -trackOffset;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw Car
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            ctx.fillStyle = '#ff3333';
            ctx.fillRect(-car.width / 2, -car.height / 2, car.width, car.height);
            // windshield
            ctx.fillStyle = '#111';
            ctx.fillRect(-car.width / 3, -car.height / 3, car.width * 0.6, car.height * 0.3);
            ctx.restore();
        }

        function updateHUD() {
            document.getElementById('lap-display').innerText = `Volta: ${Math.min(currentLap, totalLaps)} / ${totalLaps}`;
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
            const mins = Math.floor(elapsed / 60);
            const secs = (elapsed % 60).toFixed(2);
            document.getElementById('time-display').innerText = `Tempo: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
            document.getElementById('speed-display').innerText = `Velocidade: ${Math.round(car.speed * 25)} km/h`;
        }

        function showVictory() {
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
            document.getElementById('final-time').innerText = `Tempo Final: ${elapsed}s`;
            document.getElementById('victory').style.display = 'block';
        }

        function restartGame() {
            car.x = canvas.width / 2;
            car.y = canvas.height - 100;
            car.speed = 0;
            car.angle = 0;
            trackOffset = 0;
            currentLap = 1;
            startTime = Date.now();
            raceFinished = false;
            document.getElementById('victory').style.display = 'none';
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
