name: Godot 4 Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot & Android Export Templates
        run: |
          sudo apt-get update && sudo apt-get install -y wget unzip
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable/
          # Tentando URL alternativa caso a anterior tenha dado 404 (exit code 8 do wget)
          # A URL oficial de template do Godot 4 frequentemente usa outro sufixo ou precisa de redirect
          # Vou garantir que o diretório exista corretamente e tentar baixar.
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/BlackCoreAscension.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackCoreAscension-Android-APK
          path: build/BlackCoreAscension.apk
