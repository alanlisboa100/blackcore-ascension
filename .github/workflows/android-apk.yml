name: Black Core Android APK

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run EditMode tests before building"
        required: false
        default: false
        type: boolean

jobs:
  preflight:
    name: Black Core preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Static project checks
        run: python3 Client/unityro_names_sprint/tools/blackcore_preflight.py --client Client/unityro_names_sprint/UnityClient

      - name: Configure local Addressables for APK
        run: python3 Client/unityro_names_sprint/tools/blackcore_addressables_profile.py local-apk --client Client/unityro_names_sprint/UnityClient

      - name: APK readiness report
        run: python3 Client/unityro_names_sprint/tools/blackcore_apk_readiness.py --client Client/unityro_names_sprint/UnityClient --ci

  tests:
    name: Unity EditMode tests
    if: ${{ inputs.run_tests }}
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Client/unityro_names_sprint/UnityClient/Library
          key: Library-Android-tests-${{ hashFiles('Client/unityro_names_sprint/UnityClient/Packages/packages-lock.json') }}
          restore-keys: |
            Library-Android-tests-
            Library-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Client/unityro_names_sprint/UnityClient
          unityVersion: 2021.3.8f1
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  build-apk:
    name: Build Android APK
    needs: [preflight, tests]
    if: ${{ always() && needs.preflight.result == 'success' && (!inputs.run_tests || needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Client/unityro_names_sprint/UnityClient/Library
          key: Library-Android-${{ hashFiles('Client/unityro_names_sprint/UnityClient/Packages/packages-lock.json', 'Client/unityro_names_sprint/UnityClient/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Configure local Addressables for APK
        run: python3 Client/unityro_names_sprint/tools/blackcore_addressables_profile.py local-apk --client Client/unityro_names_sprint/UnityClient

      - name: Build Black Core APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Client/unityro_names_sprint/UnityClient
          unityVersion: 2021.3.8f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildsPath: build
          allowDirtyBuild: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackCore-Ascension-Android
          path: build/Android
          if-no-files-found: error
          retention-days: 14
