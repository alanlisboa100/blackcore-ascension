name: Godot 4 Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3-stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Export Templates
        run: |
          apt-get update && apt-get install -y wget unzip
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable/
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_android_release.perfetto.apk -O ~/.local/share/godot/export_templates/4.7.2.stable/android_release.apk
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_android_debug.perfetto.apk -O ~/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/BlackCoreAscension.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackCoreAscension-Android-APK
          path: build/BlackCoreAscension.apk
