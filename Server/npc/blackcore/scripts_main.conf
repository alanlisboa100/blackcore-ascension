// --------------------------------------------------------------
// Black Core: Ascension - Alpha Content Profile
// --------------------------------------------------------------
// Keeps engine support, map flags, monster spawns and warps while
// disabling the large legacy NPC/quest/job-script surface.
// Black Core custom content is loaded from scripts_custom.conf.

// Core helper functions used by item/scripts.
npc: npc/other/Global_Functions.txt
npc: npc/other/CashShop_Functions.txt

// Invisible/system map behavior.
import: npc/scripts_mapflags.conf
import: npc/re/scripts_mapflags.conf

// Keep monster population while our authored spawn tables are still growing.
import: npc/scripts_monsters.conf
import: npc/re/scripts_monsters.conf

// Keep map-to-map traversal during alpha. Player-facing map names are handled
// by the Black Core client identity layer.
import: npc/scripts_warps.conf
import: npc/re/scripts_warps.conf

// Only active custom scripts in this file are Black Core scripts.
import: npc/scripts_custom.conf
